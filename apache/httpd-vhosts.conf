<VirtualHost *:80>
    ServerName looprag.test
    ServerAlias test.gzai.com localhost 127.0.0.1
    DocumentRoot "/Users/37user/Documents/LooP RaG/public"

    <Directory "/Users/37user/Documents/LooP RaG/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>

<VirtualHost *:80>
    ServerName erp.laravel13.com
    ServerAlias test.laravel13.com
    DocumentRoot "/Users/37user/Documents/GitHub/laravel13/public"

    <Directory "/Users/37user/Documents/GitHub/laravel13/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "/usr/local/var/log/httpd/erp.laravel13.com-error.log"
    CustomLog "/usr/local/var/log/httpd/erp.laravel13.com-access.log" combined
</VirtualHost>
